<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700">
  <defs>
    <style>
      .box { fill: #f8f9fa; stroke: #343a40; stroke-width: 2; rx: 8; }
      .power-box { fill: #ffeeba; stroke: #856404; stroke-width: 2; rx: 8; }
      .esp-box { fill: #d1ecf1; stroke: #0c5460; stroke-width: 2; rx: 8; }
      .text-title { font-family: monospace; font-size: 16px; font-weight: bold; fill: #333; }
      .text-pin { font-family: monospace; font-size: 12px; fill: #555; }
      .wire-5v { stroke: #dc3545; stroke-width: 3; fill: none; }
      .wire-gnd { stroke: #343a40; stroke-width: 3; fill: none; }
      .wire-sig { stroke: #007bff; stroke-width: 2; fill: none; stroke-dasharray: 4; }
    </style>
  </defs>
  
  <rect width="1000" height="700" fill="#ffffff"/>
  <text x="500" y="40" font-family="monospace" font-size="24" font-weight="bold" text-anchor="middle">Smart Sentry Wiring &amp; Pinout Diagram</text>

  <!-- ESP32 -->
  <rect class="esp-box" x="100" y="100" width="200" height="400"/>
  <text class="text-title" x="200" y="130" text-anchor="middle">ESP32 (38-Pin)</text>
  
  <text class="text-pin" x="280" y="180" text-anchor="end">GND</text>
  <circle cx="290" cy="176" r="4" fill="#333"/>

  <text class="text-pin" x="280" y="220" text-anchor="end">GPIO 5 (TRIG)</text>
  <circle cx="290" cy="216" r="4" fill="#333"/>
  
  <text class="text-pin" x="280" y="260" text-anchor="end">GPIO 34 (ECHO)</text>
  <circle cx="290" cy="256" r="4" fill="#333"/>

  <text class="text-pin" x="280" y="300" text-anchor="end">GPIO 4 (RCWL)</text>
  <circle cx="290" cy="296" r="4" fill="#333"/>

  <text class="text-pin" x="280" y="340" text-anchor="end">GPIO 13 (PAN)</text>
  <circle cx="290" cy="336" r="4" fill="#333"/>

  <text class="text-pin" x="280" y="380" text-anchor="end">GPIO 12 (TILT)</text>
  <circle cx="290" cy="376" r="4" fill="#333"/>

  <!-- CA6009 Power -->
  <rect class="power-box" x="400" y="550" width="200" height="100"/>
  <text class="text-title" x="500" y="580" text-anchor="middle">CA6009 Boost Converter</text>
  <text class="text-pin" x="420" y="610">OUT- (GND)</text>
  <circle cx="410" cy="606" r="4" fill="#333"/>
  <text class="text-pin" x="530" y="610">OUT+ (5.0V)</text>
  <circle cx="585" cy="606" r="4" fill="#333"/>

  <!-- HC-SR04 -->
  <rect class="box" x="700" y="100" width="180" height="120"/>
  <text class="text-title" x="790" y="130" text-anchor="middle">HC-SR04</text>
  
  <circle cx="710" cy="150" r="4" fill="#333"/>
  <text class="text-pin" x="725" y="154">VCC</text>
  
  <circle cx="710" cy="170" r="4" fill="#333"/>
  <text class="text-pin" x="725" y="174">TRIG</text>
  
  <circle cx="710" cy="190" r="4" fill="#333"/>
  <text class="text-pin" x="725" y="194">ECHO</text>

  <circle cx="710" cy="210" r="4" fill="#333"/>
  <text class="text-pin" x="725" y="214">GND</text>

  <!-- RCWL-0516 -->
  <rect class="box" x="700" y="260" width="180" height="100"/>
  <text class="text-title" x="790" y="290" text-anchor="middle">RCWL-0516</text>
  
  <circle cx="710" cy="310" r="4" fill="#333"/>
  <text class="text-pin" x="725" y="314">VIN (5V)</text>
  
  <circle cx="710" cy="330" r="4" fill="#333"/>
  <text class="text-pin" x="725" y="334">OUT</text>
  
  <circle cx="710" cy="350" r="4" fill="#333"/>
  <text class="text-pin" x="725" y="354">GND</text>

  <!-- Pan Servo -->
  <rect class="box" x="700" y="400" width="180" height="100"/>
  <text class="text-title" x="790" y="430" text-anchor="middle">Pan Servo</text>
  
  <circle cx="710" cy="450" r="4" fill="#333"/>
  <text class="text-pin" x="725" y="454">VCC (Red)</text>
  
  <circle cx="710" cy="470" r="4" fill="#333"/>
  <text class="text-pin" x="725" y="474">PWM (Orange)</text>
  
  <circle cx="710" cy="490" r="4" fill="#333"/>
  <text class="text-pin" x="725" y="494">GND (Brown)</text>

  <!-- Tilt Servo -->
  <rect class="box" x="700" y="530" width="180" height="100"/>
  <text class="text-title" x="790" y="560" text-anchor="middle">Tilt Servo</text>
  
  <circle cx="710" cy="580" r="4" fill="#333"/>
  <text class="text-pin" x="725" y="584">VCC (Red)</text>
  
  <circle cx="710" cy="600" r="4" fill="#333"/>
  <text class="text-pin" x="725" y="604">PWM (Orange)</text>
  
  <circle cx="710" cy="620" r="4" fill="#333"/>
  <text class="text-pin" x="725" y="624">GND (Brown)</text>

  <!-- WIRING ROUTES -->
  <!-- 5V Rail -->
  <path class="wire-5v" d="M 585 606 L 680 606 L 680 150 L 710 150"/>
  <path class="wire-5v" d="M 680 310 L 710 310"/>
  <path class="wire-5v" d="M 680 450 L 710 450"/>
  <path class="wire-5v" d="M 680 580 L 710 580"/>

  <!-- GND Rail -->
  <path class="wire-gnd" d="M 410 606 L 360 606 L 360 176 L 290 176"/> <!-- To ESP32 -->
  <path class="wire-gnd" d="M 360 606 L 360 650 L 660 650 L 660 210 L 710 210"/> <!-- To Sensors -->
  <path class="wire-gnd" d="M 660 350 L 710 350"/>
  <path class="wire-gnd" d="M 660 490 L 710 490"/>
  <path class="wire-gnd" d="M 660 620 L 710 620"/>

  <!-- Signals -->
  <!-- HC-SR04 TRIG (GPIO 5) -->
  <path class="wire-sig" d="M 290 216 L 600 216 L 600 170 L 710 170" stroke="#007bff"/>
  
  <!-- HC-SR04 ECHO (GPIO 34) -->
  <path class="wire-sig" d="M 290 256 L 615 256 L 615 190 L 710 190" stroke="#28a745"/>

  <!-- RCWL OUT (GPIO 4) -->
  <path class="wire-sig" d="M 290 296 L 600 296 L 600 330 L 710 330" stroke="#6f42c1"/>

  <!-- Pan PWM (GPIO 13) -->
  <path class="wire-sig" d="M 290 336 L 580 336 L 580 470 L 710 470" stroke="#fd7e14"/>

  <!-- Tilt PWM (GPIO 12) -->
  <path class="wire-sig" d="M 290 376 L 560 376 L 560 600 L 710 600" stroke="#17a2b8"/>
  
  <!-- Legend -->
  <rect x="100" y="550" width="200" height="100" fill="#ffffff" stroke="#333"/>
  <text x="200" y="570" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">Legend</text>
  <line x1="120" y1="590" x2="160" y2="590" class="wire-5v"/>
  <text x="170" y="594" class="text-pin">5V Power (Red)</text>
  <line x1="120" y1="610" x2="160" y2="610" class="wire-gnd"/>
  <text x="170" y="614" class="text-pin">Common GND (Black)</text>
  <line x1="120" y1="630" x2="160" y2="630" class="wire-sig"/>
  <text x="170" y="634" class="text-pin">Data/PWM Signal (Dash)</text>

</svg>
