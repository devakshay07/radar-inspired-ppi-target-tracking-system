<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 850" width="1100" height="850">
  <defs>
    <style>
      .box { fill: #f8f9fa; stroke: #343a40; stroke-width: 2; rx: 8; }
      .power-box { fill: #ffeeba; stroke: #856404; stroke-width: 2; rx: 8; }
      .esp-box { fill: #d1ecf1; stroke: #0c5460; stroke-width: 2; rx: 8; }
      .text-title { font-family: monospace; font-size: 16px; font-weight: bold; fill: #333; }
      .text-pin { font-family: monospace; font-size: 12px; fill: #555; }
      .wire-5v { stroke: #dc3545; stroke-width: 3; fill: none; }
      .wire-gnd { stroke: #343a40; stroke-width: 3; fill: none; }
      .wire-sig { stroke: #007bff; stroke-width: 2; fill: none; stroke-dasharray: 4; }
    </style>
  </defs>
  
  <rect width="1100" height="850" fill="#ffffff"/>
  <text x="550" y="40" font-family="monospace" font-size="24" font-weight="bold" text-anchor="middle">Smart Sentry Wiring &amp; Pinout (3-Servo Setup)</text>

  <!-- ESP32 -->
  <rect class="esp-box" x="100" y="100" width="200" height="450"/>
  <text class="text-title" x="200" y="130" text-anchor="middle">ESP32 (38-Pin)</text>
  
  <text class="text-pin" x="280" y="180" text-anchor="end">GND</text>
  <circle cx="290" cy="176" r="4" fill="#333"/>
  <text class="text-pin" x="280" y="220" text-anchor="end">GPIO 5 (TRIG)</text>
  <circle cx="290" cy="216" r="4" fill="#333"/>
  <text class="text-pin" x="280" y="260" text-anchor="end">GPIO 34 (ECHO)</text>
  <circle cx="290" cy="256" r="4" fill="#333"/>
  <text class="text-pin" x="280" y="300" text-anchor="end">GPIO 4 (RCWL)</text>
  <circle cx="290" cy="296" r="4" fill="#333"/>
  
  <text class="text-pin" x="280" y="340" text-anchor="end">GPIO 26 (SCAN)</text>
  <circle cx="290" cy="336" r="4" fill="#333"/>
  <text class="text-pin" x="280" y="380" text-anchor="end">GPIO 25 (PAN)</text>
  <circle cx="290" cy="376" r="4" fill="#333"/>
  <text class="text-pin" x="280" y="420" text-anchor="end">GPIO 27 (TILT)</text>
  <circle cx="290" cy="416" r="4" fill="#333"/>

  <!-- CA6009 Power -->
  <rect class="power-box" x="450" y="650" width="200" height="100"/>
  <text class="text-title" x="550" y="680" text-anchor="middle">CA6009 Boost Converter</text>
  <text class="text-pin" x="470" y="710">OUT- (GND)</text>
  <circle cx="460" cy="706" r="4" fill="#333"/>
  <text class="text-pin" x="580" y="710">OUT+ (5.0V)</text>
  <circle cx="635" cy="706" r="4" fill="#333"/>

  <!-- HC-SR04 -->
  <rect class="box" x="800" y="100" width="180" height="120"/>
  <text class="text-title" x="890" y="130" text-anchor="middle">HC-SR04</text>
  <circle cx="810" cy="150" r="4" fill="#333"/> <text class="text-pin" x="825" y="154">VCC</text>
  <circle cx="810" cy="170" r="4" fill="#333"/> <text class="text-pin" x="825" y="174">TRIG</text>
  <circle cx="810" cy="190" r="4" fill="#333"/> <text class="text-pin" x="825" y="194">ECHO</text>
  <circle cx="810" cy="210" r="4" fill="#333"/> <text class="text-pin" x="825" y="214">GND</text>

  <!-- RCWL-0516 -->
  <rect class="box" x="800" y="240" width="180" height="100"/>
  <text class="text-title" x="890" y="270" text-anchor="middle">RCWL-0516</text>
  <circle cx="810" cy="290" r="4" fill="#333"/> <text class="text-pin" x="825" y="294">VIN (5V)</text>
  <circle cx="810" cy="310" r="4" fill="#333"/> <text class="text-pin" x="825" y="314">OUT</text>
  <circle cx="810" cy="330" r="4" fill="#333"/> <text class="text-pin" x="825" y="334">GND</text>

  <!-- Scan Servo -->
  <rect class="box" x="800" y="360" width="180" height="100"/>
  <text class="text-title" x="890" y="390" text-anchor="middle">Scan Servo</text>
  <circle cx="810" cy="410" r="4" fill="#333"/> <text class="text-pin" x="825" y="414">VCC (Red)</text>
  <circle cx="810" cy="430" r="4" fill="#333"/> <text class="text-pin" x="825" y="434">PWM (Orange)</text>
  <circle cx="810" cy="450" r="4" fill="#333"/> <text class="text-pin" x="825" y="454">GND (Brown)</text>

  <!-- Pan Servo -->
  <rect class="box" x="800" y="480" width="180" height="100"/>
  <text class="text-title" x="890" y="510" text-anchor="middle">Pan Servo</text>
  <circle cx="810" cy="530" r="4" fill="#333"/> <text class="text-pin" x="825" y="534">VCC (Red)</text>
  <circle cx="810" cy="550" r="4" fill="#333"/> <text class="text-pin" x="825" y="554">PWM (Orange)</text>
  <circle cx="810" cy="570" r="4" fill="#333"/> <text class="text-pin" x="825" y="574">GND (Brown)</text>

  <!-- Tilt Servo -->
  <rect class="box" x="800" y="600" width="180" height="100"/>
  <text class="text-title" x="890" y="630" text-anchor="middle">Tilt Servo</text>
  <circle cx="810" cy="650" r="4" fill="#333"/> <text class="text-pin" x="825" y="654">VCC (Red)</text>
  <circle cx="810" cy="670" r="4" fill="#333"/> <text class="text-pin" x="825" y="674">PWM (Orange)</text>
  <circle cx="810" cy="690" r="4" fill="#333"/> <text class="text-pin" x="825" y="694">GND (Brown)</text>

  <!-- 5V Rail -->
  <path class="wire-5v" d="M 635 706 L 780 706 L 780 150 L 810 150"/>
  <path class="wire-5v" d="M 780 290 L 810 290"/>
  <path class="wire-5v" d="M 780 410 L 810 410"/>
  <path class="wire-5v" d="M 780 530 L 810 530"/>
  <path class="wire-5v" d="M 780 650 L 810 650"/>

  <!-- GND Rail -->
  <path class="wire-gnd" d="M 460 706 L 360 706 L 360 176 L 290 176"/> <!-- To ESP32 -->
  <path class="wire-gnd" d="M 360 706 L 360 740 L 750 740 L 750 210 L 810 210"/> <!-- To Sensors -->
  <path class="wire-gnd" d="M 750 330 L 810 330"/>
  <path class="wire-gnd" d="M 750 450 L 810 450"/>
  <path class="wire-gnd" d="M 750 570 L 810 570"/>
  <path class="wire-gnd" d="M 750 690 L 810 690"/>

  <!-- Signals -->
  <path class="wire-sig" d="M 290 216 L 620 216 L 620 170 L 810 170" stroke="#007bff"/> <!-- TRIG (5) -->
  <path class="wire-sig" d="M 290 256 L 640 256 L 640 190 L 810 190" stroke="#28a745"/> <!-- ECHO (34) -->
  <path class="wire-sig" d="M 290 296 L 660 296 L 660 310 L 810 310" stroke="#6f42c1"/> <!-- RCWL (4) -->
  <path class="wire-sig" d="M 290 336 L 680 336 L 680 430 L 810 430" stroke="#fd7e14"/> <!-- SCAN (26) -->
  <path class="wire-sig" d="M 290 376 L 700 376 L 700 550 L 810 550" stroke="#e83e8c"/> <!-- PAN (25) -->
  <path class="wire-sig" d="M 290 416 L 720 416 L 720 670 L 810 670" stroke="#17a2b8"/> <!-- TILT (27) -->

</svg>
