<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333" />
    </marker>
  </defs>
  <rect width="400" height="600" fill="#ffffff"/>
  <rect x="100" y="50" width="200" height="50" rx="10" fill="#cce5ff" stroke="#333"/>
  <text x="200" y="80" font-family="Arial" font-size="14" text-anchor="middle">Initialize Hardware</text>
  <rect x="100" y="150" width="200" height="50" fill="#fff3cd" stroke="#333"/>
  <text x="200" y="180" font-family="Arial" font-size="14" text-anchor="middle">Continuous Scan (Servo)</text>
  <rect x="100" y="250" width="200" height="50" fill="#d4edda" stroke="#333"/>
  <text x="200" y="280" font-family="Arial" font-size="14" text-anchor="middle">Measure Distance &amp; Filter</text>
