  <line x1="200" y1="100" x2="200" y2="150" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="200" y1="200" x2="200" y2="250" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="200" y1="300" x2="200" y2="350" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="200" y1="400" x2="200" y2="450" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 100 475 L 50 475 L 50 175 L 100 175" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
